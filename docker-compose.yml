services:
  app:
    build: .
    # Pas de "ports:" ici : Dokploy route le trafic vers le port 3000 du
    # conteneur via son proxy (Traefik). Publier 3000:3000 sur l'hôte
    # entre en conflit avec le service qui occupe déjà ce port.
    expose:
      - "3000"
    environment:
      - DATA_DIR=/app/data
      # Provider de prix réels : service fast-flights (Google Flights) ci-dessous.
      # Sans cette variable, l'app retombe sur le provider de simulation.
      - FAST_FLIGHTS_URL=http://flights:8000
    volumes:
      - flydeal-data:/app/data
    depends_on:
      flights:
        condition: service_started
    restart: unless-stopped

  # Service de récupération des prix : scraper Google Flights (fast-flights,
  # https://github.com/AWeirdDev/flights) exposé en HTTP par FastAPI.
  flights:
    build: ./flights-service
    expose:
      - "8000"
    restart: unless-stopped

volumes:
  flydeal-data:
