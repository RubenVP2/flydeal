services:
  app:
    build: .
    # Pas de "ports:" ici : Dokploy route le trafic vers le port 3000 du
    # conteneur via son proxy (Traefik). Publier 3000:3000 sur l'hôte
    # entre en conflit avec le service qui occupe déjà ce port.
    expose:
      - "3000"
    environment:
      - DATA_DIR=/app/data
      # - FLY_API_KEY=votre_cle_flightapi   # optionnel : active le provider FlightAPI.io
    volumes:
      - flydeal-data:/app/data
    restart: unless-stopped

volumes:
  flydeal-data:
